# Adapted from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      TORCH_INSTALL: 1
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::magick
          needs: check
      - name: Install libtorch
        run: Rscript -e 'torch::install_torch()'
      # The TCGA example cohorts are not shipped: build them once (Bioconductor,
      # Linux only) and cache the processed files so vignettes and examples run.
      - name: Cache TCGA cohorts
        if: runner.os == 'Linux'
        id: tcga-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/binnr
          key: binnr-data-${{ hashFiles('R/tcga.R', 'data/reactome_tcga.rda') }}
      - name: Build TCGA cohorts
        if: runner.os == 'Linux' && steps.tcga-cache.outputs.cache-hit != 'true'
        run: |
          Rscript -e 'install.packages("BiocManager"); BiocManager::install(c("curatedTCGAData", "TCGAutils"), ask = FALSE, update = FALSE)'
          Rscript -e 'pkgload::load_all(); tcga_cohort("BRCA"); tcga_cohort("PRAD")'
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
